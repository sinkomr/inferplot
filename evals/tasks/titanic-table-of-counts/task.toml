# Evaluation task titanic-table-of-counts (evals/README.md). Generated from the oracle
# fixtures it cites; tests/test_evals.py checks every number against them.
id = "titanic-table-of-counts"
function = "barstats"
trap = "data given as a table of counts (a Freq column): n is 2,201 people, not 32 rows"
request = """
data.csv is a table of counts of the people aboard the Titanic by class, sex,
age group and survival: the column Freq says how many people each row stands for.
Did survival differ between the classes (1st, 2nd, 3rd and crew)?
"""
design = "two categorical variables, data as a table of counts"
correct_rule = "Pearson's chi-square test of independence on the 4 x 2 table of 2,201 people. Treating the 32 rows as observations is flagged as a trap."
rejected = []

[data]
file = "data.csv"
source = "oracle/datasets/Titanic_counts.csv"
columns = { Class = "Class", Sex = "Sex", Age = "Age", Survived = "Survived", Freq = "Freq" }
note = "R datasets::Titanic as a data frame"

[reference]
args = ["Class", "Survived"]
kwargs = { counts = "Freq" }
check_codes = []

[[accepted]]
family = "chi_square_independence"
source = "fixture"
fixture = "ggbarstats-Titanic_counts-class-parametric"
kwargs = { counts = "Freq" }
[accepted.numbers]
statistic = { value = 190.401103616833, key = "stats/subtitle_data/0/statistic" }
df = { value = 3.0, key = "stats/subtitle_data/0/df" }
p_value = { value = 4.99992752986802e-41, key = "stats/subtitle_data/0/p.value" }
estimate = { value = 0.291859071455131, key = "stats/subtitle_data/0/estimate" }
conf_low = { value = 0.247991346689389, key = "stats/subtitle_data/0/conf.low" }
conf_high = { value = 0.332479098301525, key = "stats/subtitle_data/0/conf.high" }
n = { value = 2201.0, key = "stats/subtitle_data/0/n.obs" }

[[traps]]
family = "chi_square_independence"
label = "chi-square on the 32 rows, ignoring Freq"
source = "recipe"
recipe = "chi2_rows_unweighted"
recipe_args = { x = "Class", y = "Survived" }
[traps.numbers]
statistic = { value = 0.0 }
p_value = { value = 1.0 }
