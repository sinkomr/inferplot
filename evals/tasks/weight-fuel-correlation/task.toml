# Evaluation task weight-fuel-correlation (evals/README.md). Generated from the oracle
# fixtures it cites; tests/test_evals.py checks every number against them.
id = "weight-fuel-correlation"
function = "scatterstats"
trap = "none (baseline): two measurements on the same cars"
request = """
Is car weight (wt, in 1000 lb) related to fuel economy (mpg) in data.csv?
Please plot it and report how strong the relationship is.
"""
design = "two continuous measurements on 32 cars"
correct_rule = "Pearson's or Spearman's correlation (the statistic may be given as t or S, or as r or rho)."
rejected = []

[data]
file = "data.csv"
source = "oracle/datasets/mtcars.csv"
columns = { model = "car", wt = "wt", mpg = "mpg" }
note = "R datasets::mtcars"

[reference]
args = ["wt", "mpg"]
kwargs = { type = "parametric" }
check_codes = []

