# Evaluation task grip-strength-missed-visits (evals/README.md). Generated from the oracle
# fixtures it cites; tests/test_evals.py checks every number against them.
id = "grip-strength-missed-visits"
function = "withinstats"
trap = "paired data with missed visits: only the 12 patients with both visits can be paired"
trap_scoring = "traps"
request = """
Grip strength (kg) of patients before and after a six-week rehabilitation
programme (data.csv: patient, visit, grip_kg, one row per patient and visit).
A few patients missed one of the two visits or have an incomplete row. Did grip
strength change?
"""
design = "two time points on the same patients; incomplete patients"
correct_rule = "A paired analysis of the 12 complete patients: the paired t-test, the Wilcoxon signed-rank test (each SciPy variant: exact p, normal approximation with or without continuity correction) or the sign test (n as 12 pairs or 24 observations). An unpaired test on all rows is flagged as a trap."
rejected = ["welch_t", "student_t", "mann_whitney"]

[data]
file = "data.csv"
source = "oracle/datasets/edge_within2_missing.csv"
columns = { subject = "patient", condition = "visit", value = "grip_kg" }
levels = { visit = { pre = "before", post = "after" } }
note = "inferplot oracle dataset edge_within2_missing (hand-made); renamed"

[reference]
args = ["visit", "grip_kg"]
kwargs = { subject_id = "patient", type = "parametric" }
check_codes = ["rows_dropped"]

[counts]  # every n an answer may report; the dry run recomputes each
pairs = 12  # subjects with both conditions
observations = 24  # values the test used
nonzero_differences = 12  # differences that are not zero (rank and sign tests drop the others)

[[accepted]]
n_also = ["observations"]
family = "paired_t"
source = "fixture"
fixture = "ggwithinstats-edge_within2_missing-parametric"
kwargs = { subject_id = "patient", type = "parametric" }
[accepted.numbers]
statistic = { value = 3.68841930055446, key = "stats/subtitle_data/0/statistic" }
df = { value = 11.0, key = "stats/subtitle_data/0/df.error" }
p_value = { value = 0.0035729869435804, key = "stats/subtitle_data/0/p.value" }
estimate = { value = 0.99017929984084, key = "stats/subtitle_data/0/estimate" }
conf_low = { value = 0.310164497512419, key = "stats/subtitle_data/0/conf.low" }
conf_high = { value = 1.64258725687375, key = "stats/subtitle_data/0/conf.high" }
n = { value = 12.0, key = "stats/subtitle_data/0/n.obs" }

[[accepted.effects]]
label = "Cohen's d_z"
recipe = "cohen_dz"
recipe_args = { x = "visit", y = "grip_kg", subject = "patient", levels = ["after", "before"] }
estimate = { value = 1.0647549380296657 }

[[accepted]]
n_also = ["observations", "nonzero_differences"]
family = "wilcoxon_signed_rank"
source = "fixture"
fixture = "ggwithinstats-edge_within2_missing-nonparametric"
kwargs = { subject_id = "patient", type = "nonparametric" }
[accepted.numbers]
statistic = { value = 73.0, key = "stats/subtitle_data/0/statistic", alt = [5.0] }
p_value = { value = 0.0085644533768971, key = "stats/subtitle_data/0/p.value" }
estimate = { value = 0.871794871794872, key = "stats/subtitle_data/0/estimate" }
conf_low = { value = 0.604289377706298, key = "stats/subtitle_data/0/conf.low" }
conf_high = { value = 0.962670963089941, key = "stats/subtitle_data/0/conf.high" }
n = { value = 12.0, key = "stats/subtitle_data/0/n.obs" }

[[accepted]]
family = "wilcoxon_signed_rank"
label = "Wilcoxon signed-rank test, SciPy's exact p"
source = "recipe"
recipe = "wilcoxon_signed_rank"
recipe_args = { x = "visit", y = "grip_kg", subject = "patient", levels = ["after", "before"], method = "exact", correction = false }
n_also = ["observations", "nonzero_differences"]
[accepted.numbers]
statistic = { value = 5.0, alt = [73.0] }
p_value = { value = 0.0048828125 }
n = { value = 12.0 }

[[accepted]]
family = "wilcoxon_signed_rank"
label = "Wilcoxon signed-rank test, exact p given the ties"
source = "recipe"
recipe = "wilcoxon_signed_rank"
recipe_args = { x = "visit", y = "grip_kg", subject = "patient", levels = ["after", "before"], method = "exact_ties", correction = false }
n_also = ["observations", "nonzero_differences"]
[accepted.numbers]
statistic = { value = 5.0, alt = [73.0] }
p_value = { value = 0.00439453125 }
n = { value = 12.0 }

[[accepted]]
family = "wilcoxon_signed_rank"
label = "Wilcoxon signed-rank test, normal approximation"
source = "recipe"
recipe = "wilcoxon_signed_rank"
recipe_args = { x = "visit", y = "grip_kg", subject = "patient", levels = ["after", "before"], method = "approx", correction = false }
n_also = ["observations", "nonzero_differences"]
[accepted.numbers]
statistic = { value = 5.0, alt = [73.0, -2.6682058683340313] }
p_value = { value = 0.007625751605758413 }
n = { value = 12.0 }

[[accepted]]
family = "sign_test"
label = "sign test (exact binomial)"
source = "recipe"
recipe = "sign_test"
recipe_args = { x = "visit", y = "grip_kg", subject = "patient", levels = ["after", "before"] }
n_also = ["observations", "nonzero_differences"]
[accepted.numbers]
statistic = { value = 11.0, alt = [1.0] }
p_value = { value = 0.00634765625 }
n = { value = 12.0 }

[[traps]]
family = "welch_t"
label = "unpaired Welch's t-test on all rows"
source = "recipe"
recipe = "welch_t"
recipe_args = { x = "visit", y = "grip_kg", levels = ["after", "before"] }
[traps.numbers]
statistic = { value = 2.3506740248039013 }
df = { value = 24.56297906342052 }
p_value = { value = 0.02708592200127261 }
n = { value = 27.0 }
