name: Image baselines

# Generates the pytest-mpl baseline images in the environment that compares them:
# the CI job "Test (ubuntu-latest, Python 3.15)", which runs `pytest --mpl` (ci.yml).
# Same OS, Python, uv version, `uv sync` flags, lockfile and environment variables.
# Run it on the branch that changes a figure on purpose, download the artifact into
# tests/render/baseline/, look at every image, and commit them on that branch:
#   gh workflow run mpl-baselines.yml --ref <branch>
#   gh run download <run-id> -n mpl-baselines -D tests/render/baseline

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  HYPOTHESIS_PROFILE: ci
  PYTHONUTF8: "1"

jobs:
  generate:
    name: Generate image baselines (ubuntu-latest, Python 3.15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3 (no major tags are published)
        with:
          python-version: "3.15"
      - run: uv sync --locked --all-extras
      - name: Installed versions
        run: uv pip list
      - name: Generate baselines
        # Every image test; pytest-mpl warns that the configured baseline path is
        # ignored while generating, which the "error" warning filter would raise.
        run: >-
          uv run pytest -m "mpl_image_compare and not slow"
          -W "ignore:Ignoring --mpl-baseline-path:UserWarning"
          --mpl-generate-path=build/mpl-baselines
      - name: Upload baselines
        uses: actions/upload-artifact@v7
        with:
          name: mpl-baselines
          path: build/mpl-baselines/*.png
          if-no-files-found: error
