name: Oracle

# Generates the R oracle fixtures. Run manually:
#   gh workflow run oracle.yml
#   gh run download <run-id> -n oracle-fixtures -D tests/fixtures/oracle
# Review the fixture diff before committing it (CLAUDE.md).

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Posit Package Manager CRAN snapshot. ggstatsplot 1.1.4 reached CRAN on
  # 2026-10-22; SPEC.md section 9 requires a snapshot dated on or after 2026-10-23.
  CRAN_SNAPSHOT_DATE: "2026-10-23"
  # setup-r reads RSPM and puts it first in the `repos` option.
  RSPM: https://packagemanager.posit.co/cran/__linux__/noble/2026-10-23

jobs:
  generate:
    name: Generate fixtures with ggstatsplot 1.1.4
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          cran: ${{ env.RSPM }}
          Ncpus: "4"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          packages: |
            any::ggstatsplot
            any::statsExpressions
            any::effectsize
            any::parameters
            any::bayestestR
            any::insight
            any::datawizard
            any::correlation
            any::performance
            any::WRS2
            any::BayesFactor
            any::PMCMRplus
            any::afex
            any::ggplot2
            any::jsonlite
            any::digest
            any::sessioninfo

      - name: Check R, repositories and installed versions
        shell: Rscript {0}
        run: |
          snapshot <- Sys.getenv("CRAN_SNAPSHOT_DATE")
          repos <- getOption("repos")
          print(repos)
          if (!all(grepl(snapshot, repos, fixed = TRUE))) {
            stop("every repository must be the ", snapshot, " snapshot")
          }
          if (getRversion() < "4.5.0" || getRversion() >= "4.6.0") {
            stop("R 4.5 is required; found ", getRversion())
          }
          if (as.character(packageVersion("ggstatsplot")) != "1.1.4") {
            stop("ggstatsplot ", packageVersion("ggstatsplot"), " installed; 1.1.4 required")
          }
          # Every package installed outside R's own library must be the snapshot's
          # version (pak itself comes from its own repository).
          available <- available.packages(repos = repos[["CRAN"]])
          installed <- installed.packages(lib.loc = setdiff(.libPaths(), .Library))
          installed <- installed[installed[, "Package"] != "pak", , drop = FALSE]
          known <- installed[, "Package"] %in% rownames(available)
          mismatch <- installed[known, "Version"] !=
            available[installed[known, "Package"], "Version"]
          if (any(mismatch)) {
            print(cbind(
              installed = installed[known, "Version"][mismatch],
              snapshot = available[installed[known, "Package"], "Version"][mismatch]
            ))
            stop("installed versions differ from the snapshot")
          }
          if (any(!known)) {
            stop("not in the snapshot: ", paste(installed[!known, "Package"], collapse = ", "))
          }
          sessioninfo::session_info(pkgs = "attached", include_base = TRUE)
          print(installed[, c("Package", "Version")], quote = FALSE)

      - name: Export R-provided datasets
        run: Rscript oracle/export_datasets.R oracle/datasets

      - name: Committed datasets must be unchanged
        run: |
          git status --short -- oracle/datasets
          git diff --exit-code --stat -- oracle/datasets

      - name: Generate fixtures
        run: Rscript oracle/generate.R oracle/datasets oracle/out

      - name: Upload fixtures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oracle-fixtures
          path: oracle/out/
          if-no-files-found: error

      - name: Upload datasets
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oracle-datasets
          path: oracle/datasets/
          if-no-files-found: error
