name: Fixture provenance

# Checks that the committed oracle fixtures are what oracle.yml produced from the
# committed generator:
# 1. tests/fixtures/oracle/manifest.json carries a build-provenance attestation signed
#    by .github/workflows/oracle.yml in this repository, as that file stood at the
#    commit the manifest names (the signer's own commit is pinned too, so a copy
#    called from another ref does not count), by the run the manifest names. A
#    hand-edited or re-hashed manifest has none, and a fork's pull request cannot
#    sign one.
# 2. That commit is in this branch's history, and its generator files
#    (oracle/generate.R, oracle/export_datasets.R, oracle.yml) equal the committed
#    ones, so the fixtures are what the committed generator writes. A branch that
#    carries new fixtures must therefore land with a merge commit or a fast-forward:
#    a squash or rebase merge drops the oracle's commit from main's history.
# tests/oracle_fixtures.py then ties every fixture, every dataset a fixture read and
# every generator file to the SHA-256 values in the manifest, on every CI run.
# Attestations do not expire, so this check runs on every push to any branch.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

jobs:
  verify:
    name: Fixtures match their oracle run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The attested commit must be found in this branch's history.
          fetch-depth: 0

      - name: Verify the manifest's attestation and the generator it ran
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest=tests/fixtures/oracle/manifest.json
          field() {
            python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["run"][sys.argv[2]])' "$manifest" "$1"
          }
          repository=$(field repository)
          run_id=$(field run_id)
          commit=$(field commit)
          echo "manifest.json names oracle run $run_id of $repository at $commit"
          test "$repository" = "$GITHUB_REPOSITORY"

          gh attestation verify "$manifest" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/oracle.yml" \
            --source-digest "$commit" \
            --signer-digest "$commit" \
            --deny-self-hosted-runners \
            --format json > "$RUNNER_TEMP/attestation.json"
          python3 -I - "$RUNNER_TEMP/attestation.json" "$run_id" <<'PY'
          import json
          import re
          import sys

          runs = set()

          def walk(node):
              if isinstance(node, dict):
                  for value in node.values():
                      walk(value)
              elif isinstance(node, list):
                  for value in node:
                      walk(value)
              elif isinstance(node, str):
                  runs.update(re.findall(r"/actions/runs/(\d+)/attempts/", node))

          walk(json.load(open(sys.argv[1], encoding="utf-8")))
          if runs != {sys.argv[2]}:
              sys.exit(f"attested by run(s) {sorted(runs)}, not run {sys.argv[2]}")
          PY

          if ! git merge-base --is-ancestor "$commit" HEAD; then
            echo "::error::oracle run $run_id's commit $commit is not in this branch's history. A squash or rebase merge drops it: land fixture branches with a merge commit or a fast-forward, or run oracle.yml on this branch and commit its fixtures."
            exit 1
          fi
          if ! git diff --exit-code --stat "$commit" HEAD -- \
            oracle/generate.R oracle/export_datasets.R .github/workflows/oracle.yml; then
            echo "::error::the generator changed since oracle run $run_id ($commit): run oracle.yml on this branch and commit its fixtures."
            exit 1
          fi
          echo "manifest.json is attested by oracle.yml run $run_id at $commit, which is in this branch's history with the committed generator."
