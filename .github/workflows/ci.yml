name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  HYPOTHESIS_PROFILE: ci
  PYTHONUTF8: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.15"
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.15"
      - run: uv sync --locked --all-extras
      - run: uv run pyright

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Oldest supported Python, and the newest with numpy, scipy and matplotlib
        # wheels (DECISIONS.md D15).
        python: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      - name: Tests
        # Image baselines are generated on Linux only, so --mpl runs only there.
        run: >-
          uv run pytest -q -m "not slow"
          ${{ (matrix.os == 'ubuntu-latest' && matrix.python == '3.15') && '--mpl' || '' }}
      - name: Reference known-answer checks
        run: uv run python -I tools/reference/stats_reference.py

  lowest:
    name: Test (lowest direct dependencies, Python 3.11)
    runs-on: ubuntu-latest
    env:
      # Applies to every uv command in the job, including the sync `uv run` performs.
      UV_RESOLUTION: lowest-direct
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.11"
      - run: uv sync --all-extras
      - name: Installed versions
        run: uv pip list
      - name: Tests
        run: uv run pytest -q -m "not slow"
      - name: Reference known-answer checks
        run: uv run python -I tools/reference/stats_reference.py
