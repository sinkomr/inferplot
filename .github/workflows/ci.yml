name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mpl_generate:
        description: >-
          Also generate the pytest-mpl image baselines (artifact mpl-baselines) in
          the environment of the --mpl test job
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  HYPOTHESIS_PROFILE: ci
  PYTHONUTF8: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3 (no major tags are published)
        with:
          python-version: "3.15"
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3 (no major tags are published)
        with:
          python-version: "3.15"
      - run: uv sync --locked --all-extras
      - run: uv run pyright

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Oldest supported Python, and the newest with numpy, scipy and matplotlib
        # wheels (DECISIONS.md D15).
        python: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3 (no major tags are published)
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      - name: Tests
        # Image baselines are generated on Linux only, so --mpl runs only there.
        run: >-
          uv run pytest -m "not slow"
          ${{ (matrix.os == 'ubuntu-latest' && matrix.python == '3.15') && '--mpl' || '' }}
      - name: Reference known-answer checks
        run: uv run python -I tools/reference/stats_reference.py

  lowest:
    name: Test (lowest direct dependencies, Python 3.11)
    runs-on: ubuntu-latest
    env:
      # Applies to every uv command in the job, including the sync `uv run` performs.
      UV_RESOLUTION: lowest-direct
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3 (no major tags are published)
        with:
          python-version: "3.11"
      - run: uv sync --all-extras
      - name: Installed versions
        run: uv pip list
      - name: Tests
        run: uv run pytest -m "not slow"
      - name: Reference known-answer checks
        run: uv run python -I tools/reference/stats_reference.py

  mpl-baselines:
    # Generates the pytest-mpl baselines in the environment that compares them: the
    # "Test (ubuntu-latest, Python 3.15)" job above, which runs --mpl. Same OS,
    # Python, uv, sync flags, lockfile and env. For a figure changed on purpose:
    #   gh workflow run ci.yml --ref <branch> -f mpl_generate=true
    #   gh run download <run-id> -n mpl-baselines -D tests/render/baseline
    # then look at every image and commit them on that branch.
    name: Generate image baselines (ubuntu-latest, Python 3.15)
    if: inputs.mpl_generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3 (no major tags are published)
        with:
          python-version: "3.15"
      - run: uv sync --locked --all-extras
      - name: Generate baselines
        # Every image test. pytest-mpl warns that the configured baseline path is
        # ignored while generating; the "error" warning filter would raise it.
        run: >-
          uv run pytest -m "mpl_image_compare and not slow"
          -W "ignore:Ignoring --mpl-baseline-path:UserWarning"
          --mpl-generate-path=build/mpl-baselines
      - name: Upload baselines
        uses: actions/upload-artifact@v7
        with:
          name: mpl-baselines
          path: build/mpl-baselines/*.png
          if-no-files-found: error
